<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - PUBG UC Mağazası</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { color: #f59e0b; margin-bottom: 25px; font-size: 1.8rem; text-transform: uppercase; }
        .admin-section { background-color: #131822; border: 1px solid #1f293d; border-radius: 12px; padding: 20px; margin-bottom: 30px; }
        .admin-section h2 { color: #f59e0b; font-size: 1.1rem; margin-bottom: 15px; text-transform: uppercase; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; text-align: left; white-space: nowrap; }
        th, td { padding: 12px; border-bottom: 1px solid #1f293d; }
        th { color: #94a3b8; }
        td { color: #cbd5e1; }
        .btn-approve { background-color: #22c55e; color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; margin-right: 5px; }
        .btn-reject { background-color: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-approve:hover, .btn-reject:hover { opacity: 0.85; }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fa-solid fa-shield-halved"></i> Admin İdarəetmə Paneli</h1>

        <!-- Balans Sorğuları -->
        <div class="admin-section">
            <h2><i class="fa-solid fa-wallet"></i> Balans Artırma Sorğuları</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Sorğu №</th>
                            <th>İstifadəçi (Gmail)</th>
                            <th>Məbləğ</th>
                            <th>Üsul</th>
                            <th>Status</th>
                            <th>Əməliyyat</th>
                        </tr>
                    </thead>
                    <tbody id="adminBalanceTable"></tbody>
                </table>
            </div>
        </div>

        <!-- Sifarişlər -->
        <div class="admin-section">
            <h2><i class="fa-solid fa-box"></i> İstifadəçi Sifarişləri</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Sifariş №</th>
                            <th>İstifadəçi</th>
                            <th>Oyunçu ID</th>
                            <th>Paket</th>
                            <th>Qiymət</th>
                            <th>Status</th>
                            <th>Əməliyyat</th>
                        </tr>
                    </thead>
                    <tbody id="adminOrdersTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function loadAdminData() {
            let users = JSON.parse(localStorage.getItem('pubg_users') || '{}');
            let balanceRequests = JSON.parse(localStorage.getItem('pubg_balance_requests') || '[]');
            let orders = JSON.parse(localStorage.getItem('pubg_orders') || '[]');

            // Balans Sorğuları Cədvəli
            let balTbody = document.getElementById('adminBalanceTable');
            balTbody.innerHTML = balanceRequests.length === 0 ? `<tr><td colspan="6" style="text-align: center; color: #64748b;">Sorğu yoxdur.</td></tr>` : '';
            balanceRequests.forEach((req, index) => {
                balTbody.innerHTML += `
                    <tr>
                        <td>#${req.reqNo}</td>
                        <td>${req.userName} (${req.email})</td>
                        <td style="color: #22c55e; font-weight: 700;">+${req.amount.toFixed(2)} AZN</td>
                        <td>${req.method}</td>
                        <td style="color: ${req.status.includes('Təsdiqləndi') ? '#22c55e' : (req.status.includes('Ləğv') ? '#ef4444' : '#f59e0b')}">${req.status}</td>
                        <td>
                            ${req.status === 'Təsdiq Gözləyir' ? `
                                <button class="btn-approve" onclick="approveBalance(${index})">Təsdiq Et</button>
                                <button class="btn-reject" onclick="rejectBalance(${index})">Ləğv Et</button>
                            ` : 'Tamamlanıb'}
                        </td>
                    </tr>
                `;
            });

            // Sifarişlər Cədvəli
            let ordTbody = document.getElementById('adminOrdersTable');
            ordTbody.innerHTML = orders.length === 0 ? `<tr><td colspan="7" style="text-align: center; color: #64748b;">Sifariş yoxdur.</td></tr>` : '';
            orders.forEach((ord, index) => {
                ordTbody.innerHTML += `
                    <tr>
                        <td>#${ord.orderNo}</td>
                        <td>${ord.userName}</td>
                        <td>${ord.playerId}</td>
                        <td>${ord.package}</td>
                        <td>${ord.priceStr}</td>
                        <td style="color: ${ord.status.includes('Təsdiqləndi') ? '#22c55e' : (ord.status.includes('Ləğv') ? '#ef4444' : '#f59e0b')}">${ord.status}</td>
                        <td>
                            ${ord.status === 'Təsdiq Gözləyir' ? `
                                <button class="btn-approve" onclick="approveOrder(${index})">Təsdiq Et</button>
                                <button class="btn-reject" onclick="rejectOrder(${index})">Ləğv Et</button>
                            ` : 'Tamamlanıb'}
                        </td>
                    </tr>
                `;
            });
        }

        // Balans sorğusunu təsdiqlə (İstifadəçinin balansına əlavə edilir)
        function approveBalance(index) {
            let balanceRequests = JSON.parse(localStorage.getItem('pubg_balance_requests') || '[]');
            let users = JSON.parse(localStorage.getItem('pubg_users') || '{}');
            let req = balanceRequests[index];

            if (users[req.email]) {
                users[req.email].balance += req.amount;
                localStorage.setItem('pubg_users', JSON.stringify(users));
            }

            req.status = "Təsdiqləndi";
            localStorage.setItem('pubg_balance_requests', JSON.stringify(balanceRequests));
            loadAdminData();
            alert("Balans artım sorğusu təsdiqləndi və istifadəçiyə yükləndi!");
        }

        function rejectBalance(index) {
            let balanceRequests = JSON.parse(localStorage.getItem('pubg_balance_requests') || '[]');
            balanceRequests[index].status = "Ləğv edildi";
            localStorage.setItem('pubg_balance_requests', JSON.stringify(balanceRequests));
            loadAdminData();
        }

        // Sifarişi təsdiqlə (Balansdan məbləğ çıxılır)
        function approveOrder(index) {
            let orders = JSON.parse(localStorage.getItem('pubg_orders') || '[]');
            let users = JSON.parse(localStorage.getItem('pubg_users') || '{}');
            let ord = orders[index];

            if (users[ord.email]) {
                if (users[ord.email].balance < ord.priceNum) {
                    alert("XƏTA: İstifadəçinin balansı kifayət etmir!");
                    return;
                }
                users[ord.email].balance -= ord.priceNum;
                localStorage.setItem('pubg_users', JSON.stringify(users));
            }

            ord.status = "Təsdiqləndi";
            localStorage.setItem('pubg_orders', JSON.stringify(orders));
            loadAdminData();
            alert("Sifariş təsdiqləndi və istifadəçi balansından məbləğ çıxıldı!");
        }

        function rejectOrder(index) {
            let orders = JSON.parse(localStorage.getItem('pubg_orders') || '[]');
            orders[index].status = "Ləğv edildi";
            localStorage.setItem('pubg_orders', JSON.stringify(orders));
            loadAdminData();
        }

        window.onload = loadAdminData;
    </script>
</body>
</html>
