<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - İdarəetmə</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #0b0e14; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background-color: #0f131c; border-bottom: 1px solid #1a2233; }
        .logo { font-weight: 800; font-size: 1.2rem; color: #f59e0b; }
        nav a { color: #cbd5e1; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
        .admin-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; flex: 1; width: 100%; }
        .admin-header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { font-size: 1.6rem; color: #f59e0b; text-transform: uppercase; }
        .section-box { background-color: #131822; border: 1px solid #1f293d; border-radius: 12px; margin-bottom: 30px; overflow: hidden; }
        .box-heading { padding: 15px 20px; background-color: #0f131c; border-bottom: 1px solid #1f293d; font-weight: 700; color: #f59e0b; }
        .admin-table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th, td { padding: 15px 20px; border-bottom: 1px solid #1f293d; }
        th { background-color: #0f131c; color: #f59e0b; font-size: 0.8rem; text-transform: uppercase; }
        td { color: #cbd5e1; }
        .btn-approve { background-color: #22c55e; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-delete { background-color: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
        .btn-refresh { background-color: #f59e0b; color: #0b0e14; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .receipt-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; border: 1px solid #1f293d; cursor: pointer; }
        footer { background-color: #0f131c; border-top: 1px solid #1a2233; text-align: center; padding: 20px; color: #64748b; font-size: 0.8rem; margin-top: auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo">PUBG UC Admin Panel</div>
        <nav>
            <a href="index.html"><i class="fa-solid fa-house"></i> Ana Səhifəyə Qayıt</a>
        </nav>
    </header>

    <div class="admin-container">
        <div class="admin-header">
            <h1>İdarəetmə Paneli</h1>
            <button class="btn-refresh" onclick="loadAllData()"><i class="fa-solid fa-rotate"></i> Yenilə</button>
        </div>

        <!-- Balans Artırma Sorğuları -->
        <div class="section-box">
            <div class="box-heading">
                <span><i class="fa-solid fa-wallet"></i> Balans Artırma Sorğuları (m10 / Birbank)</span>
            </div>
            <div class="admin-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Sorğu #</th>
                            <th>İstifadəçi</th>
                            <th>Məbləğ</th>
                            <th>Üsul</th>
                            <th>Ödəniş Çeki</th>
                            <th>Status</th>
                            <th>Əməliyyatlar</th>
                        </tr>
                    </thead>
                    <tbody id="balanceTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- UC Sifarişləri -->
        <div class="section-box">
            <div class="box-heading">
                <span><i class="fa-solid fa-box"></i> UC Sifarişləri</span>
            </div>
            <div class="admin-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Sifariş #</th>
                            <th>İstifadəçi</th>
                            <th>Oyunçu ID</th>
                            <th>Paket</th>
                            <th>Qiymət</th>
                            <th>Status</th>
                            <th>Əməliyyatlar</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 PUBG UC Mağazası - Admin Panel</p>
    </footer>

    <script>
        function loadAllData() {
            loadBalanceRequests();
            loadOrders();
        }

        function loadBalanceRequests() {
            const tbody = document.getElementById('balanceTableBody');
            let requests = JSON.parse(localStorage.getItem('pubg_balance_requests') || '[]');
            tbody.innerHTML = '';

            if (requests.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b;">Balans artım sorğusu yoxdur.</td></tr>`;
                return;
            }

            requests.forEach((req, index) => {
                let receiptView = req.receipt ? `<a href="${req.receipt}" target="_blank"><img src="${req.receipt}" class="receipt-thumb" title="Böyütmək üçün klikləyin"></a>` : 'Yoxdur';
                tbody.innerHTML += `
                    <tr>
                        <td>#${req.reqNo}</td>
                        <td>${req.userName}</td>
                        <td style="color: #22c55e; font-weight: 700;">${req.amount}</td>
                        <td>${req.method}</td>
                        <td>${receiptView}</td>
                        <td><span style="color: ${req.status.includes('Təsdiqləndi') ? '#22c55e' : '#f59e0b'};">${req.status}</span></td>
                        <td>
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-approve" onclick="approveBalance(${index})">Təsdiqlə</button>
                                <button class="btn-delete" onclick="deleteBalanceReq(${index})">Sil</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function approveBalance(index) {
            let requests = JSON.parse(localStorage.getItem('pubg_balance_requests') || '[]');
            requests[index].status = "Təsdiqləndi";
            localStorage.setItem('pubg_balance_requests', JSON.stringify(requests));
            loadBalanceRequests();
            alert("Balans sorğusu təsdiqləndi!");
        }

        function deleteBalanceReq(index) {
            if(confirm('Silmək istədiyinizdən əminsiniz?')) {
                let requests = JSON.parse(localStorage.getItem('pubg_balance_requests') || '[]');
                requests.splice(index, 1);
                localStorage.setItem('pubg_balance_requests', JSON.stringify(requests));
                loadBalanceRequests();
            }
        }

        function loadOrders() {
            const tbody = document.getElementById('ordersTableBody');
            let orders = JSON.parse(localStorage.getItem('pubg_orders') || '[]');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b;">Sifariş yoxdur.</td></tr>`;
                return;
            }

            orders.forEach((ord, index) => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${ord.orderNo}</td>
                        <td>${ord.userName || 'Qonaq'}</td>
                        <td>${ord.playerId}</td>
                        <td>${ord.package}</td>
                        <td>${ord.price}</td>
                        <td><span style="color: ${ord.status.includes('Təsdiqləndi') ? '#22c55e' : '#f59e0b'};">${ord.status}</span></td>
                        <td>
                            <div style="display: flex; gap: 6px;">
                                <button class="btn-approve" onclick="approveOrder(${index})">Təsdiqlə</button>
                                <button class="btn-delete" onclick="deleteOrder(${index})">Sil</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function approveOrder(index) {
            let orders = JSON.parse(localStorage.getItem('pubg_orders') || '[]');
            orders[index].status = "Təsdiqləndi və Yükləndi";
            localStorage.setItem('pubg_orders', JSON.stringify(orders));
            loadOrders();
        }

        function deleteOrder(index) {
            if(confirm('Bu sifarişi silmək istədiyinizdən əminsiniz?')) {
                let orders = JSON.parse(localStorage.getItem('pubg_orders') || '[]');
                orders.splice(index, 1);
                localStorage.setItem('pubg_orders', JSON.stringify(orders));
                loadOrders();
            }
        }

        window.onload = loadAllData;
    </script>
</body>
</html>
